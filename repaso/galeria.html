<!DOCTYPE html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria</title>
    <link rel="stylesheet" href="styles/gallery.css">
</head>
<body>
    <h1>Galería de imágenes</h1>
    <h2>Centrar imagen</h2>
    <div class="centrado">
        <img src="images/goya.webp" alt="Francisco de Goya" style="width:100%;" >
        <p class="pie">Autorretrato Goya</p>
    </div>
    <h2>Galeria</h2>
    <div id= "galeria">
    </div>
    <h2>Carrusel</h2>
    <div id="carrusel" style="max-width:280px;" class="centrado">
        <img class="centrado" style="width:100%;" id="carruselImg">
        <p class= "pie" id="carruselP"></p>
        <div style="width: 126px; margin: auto;">
            <button id="first">&lt;&lt;</button>
            <button id="before">&lt;</button>
            <button id="next">&lt;</button>
            <button id="end">&gt;&gt;</button>
        </div>
    </div>
    <script src="js/gallery.js"></script>
</body>
</html>
